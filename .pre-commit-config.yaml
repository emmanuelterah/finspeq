repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: line-length
        name: 100-character line limit
        entry: python scripts/check_line_length.py
        language: system
        pass_filenames: false
