[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finspeq"
version = "0.1.0"
description = "Real-time card fraud scoring with deterministic stream processing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "import-linter>=2.0", "pyarrow>=16"]
data = ["duckdb>=1.0", "pyarrow>=16"]
training = [
    "lightgbm>=4.3",
    "onnxmltools>=1.12",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "pydantic-settings>=2.2",
    "prometheus-client>=0.20",
]
streaming = ["confluent-kafka>=2.4", "redis>=5.0", "psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["finspeq*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "ANN", "ARG", "PLR", "RUF"]
extend-select = ["D401", "W505"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-line-length = 100
max-doc-length = 100

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.isort]
known-first-party = ["finspeq", "tests"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["finspeq", "tests", "scripts"]

[[tool.mypy.overrides]]
module = [
    "duckdb", "duckdb.*", "pyarrow", "pyarrow.*", "onnxruntime", "onnxruntime.*",
    "onnxmltools", "onnxmltools.*", "sklearn", "sklearn.*", "lightgbm", "lightgbm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["integration: needs the docker compose stack running"]

[tool.importlinter]
root_package = "finspeq"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal rings"
type = "layers"
layers = [
    "finspeq.bootstrap",
    "finspeq.adapters",
    "finspeq.application",
    "finspeq.domain",
]

[[tool.importlinter.contracts]]
name = "Core imports no third-party packages"
type = "forbidden"
source_modules = ["finspeq.domain", "finspeq.application"]
forbidden_modules = [
    "redis", "confluent_kafka", "onnxruntime", "lightgbm", "numpy", "pandas",
    "duckdb", "pyarrow", "fastapi", "pydantic", "psycopg", "prometheus_client",
]

[[tool.importlinter.contracts]]
name = "Inbound and outbound adapters are independent"
type = "independence"
modules = ["finspeq.adapters.inbound", "finspeq.adapters.outbound"]
